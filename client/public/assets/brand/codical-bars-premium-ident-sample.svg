<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="3840"
  height="2504"
  viewBox="-60 -40 1840 1200"
  fill="none"
  role="img"
  aria-labelledby="codical-ident-title codical-ident-description"
  shape-rendering="geometricPrecision"
>
  <title id="codical-ident-title">Codical Health signal assembly</title>
  <desc id="codical-ident-description">A brief intelligence trace activates five colored nodes that unfold into the exact Codical Health brand mark and finish completely still.</desc>

  <defs>
    <linearGradient id="codical-signal" x1="0" y1="0" x2="1720" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EE7D4B" />
      <stop offset=".25" stop-color="#0F1EB4" />
      <stop offset=".5" stop-color="#EB966E" />
      <stop offset=".75" stop-color="#F5B250" />
      <stop offset="1" stop-color="#4132A0" />
    </linearGradient>
  </defs>

  <style>
    .ident-trace {
      stroke-dasharray: 1840;
      stroke-dashoffset: 1840;
      animation: ident-trace 1.02s cubic-bezier(.4, 0, .2, 1) 1 both;
    }

    .ident-cap,
    .ident-stem {
      transform-box: fill-box;
      will-change: transform, opacity;
      animation-duration: .7s;
      animation-delay: var(--delay);
      animation-timing-function: cubic-bezier(.16, 1, .3, 1);
      animation-iteration-count: 1;
      animation-fill-mode: both;
    }

    .ident-cap-top { animation-name: ident-cap-top; }
    .ident-cap-bottom { animation-name: ident-cap-bottom; }

    .ident-stem {
      transform-origin: center;
      animation-name: ident-stem;
    }

    @keyframes ident-trace {
      0% { opacity: 0; stroke-dashoffset: 1840; }
      10% { opacity: .12; }
      58% { opacity: .34; }
      82% { opacity: .16; }
      100% { opacity: 0; stroke-dashoffset: 0; }
    }

    @keyframes ident-cap-top {
      0% {
        opacity: 0;
        transform: translateY(var(--collapse-top)) scale(.72);
      }
      22% {
        opacity: 1;
        transform: translateY(var(--collapse-top)) scale(1);
      }
      34% {
        opacity: 1;
        transform: translateY(var(--collapse-top)) scale(1);
      }
      86% {
        opacity: 1;
        transform: translateY(var(--overshoot-top)) scale(1);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes ident-cap-bottom {
      0% {
        opacity: 0;
        transform: translateY(var(--collapse-bottom)) scale(.72);
      }
      22% {
        opacity: 1;
        transform: translateY(var(--collapse-bottom)) scale(1);
      }
      34% {
        opacity: 1;
        transform: translateY(var(--collapse-bottom)) scale(1);
      }
      86% {
        opacity: 1;
        transform: translateY(var(--overshoot-bottom)) scale(1);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes ident-stem {
      0%, 30% {
        opacity: 0;
        transform: scaleY(.001);
      }
      38% {
        opacity: 1;
        transform: scaleY(.035);
      }
      86% {
        opacity: 1;
        transform: scaleY(1.025);
      }
      100% {
        opacity: 1;
        transform: scaleY(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ident-trace { display: none; animation: none; }
      .ident-cap,
      .ident-stem { animation: none; }
    }
  </style>

  <path
    class="ident-trace"
    d="M -60 560 H 1780"
    stroke="url(#codical-signal)"
    stroke-width="8"
    stroke-linecap="round"
  />

  <g class="ident-bar ident-bar-1" style="--delay:0ms;--collapse-top:100px;--collapse-bottom:-100px;--overshoot-top:-7px;--overshoot-bottom:7px">
    <rect class="ident-stem" x="0" y="480" width="320" height="200" fill="#EE7D4B" />
    <circle class="ident-cap ident-cap-top" cx="160" cy="480" r="160" fill="#EE7D4B" />
    <circle class="ident-cap ident-cap-bottom" cx="160" cy="680" r="160" fill="#EE7D4B" />
  </g>

  <g class="ident-bar ident-bar-2" style="--delay:55ms;--collapse-top:400px;--collapse-bottom:-400px;--overshoot-top:-11px;--overshoot-bottom:11px">
    <rect class="ident-stem" x="350" y="160" width="320" height="800" fill="#0F1EB4" />
    <circle class="ident-cap ident-cap-top" cx="510" cy="160" r="160" fill="#0F1EB4" />
    <circle class="ident-cap ident-cap-bottom" cx="510" cy="960" r="160" fill="#0F1EB4" />
  </g>

  <g class="ident-bar ident-bar-3" style="--delay:110ms;--collapse-top:120px;--collapse-bottom:-120px;--overshoot-top:-7px;--overshoot-bottom:7px">
    <rect class="ident-stem" x="700" y="440" width="320" height="240" fill="#EB966E" />
    <circle class="ident-cap ident-cap-top" cx="860" cy="440" r="160" fill="#EB966E" />
    <circle class="ident-cap ident-cap-bottom" cx="860" cy="680" r="160" fill="#EB966E" />
  </g>

  <g class="ident-bar ident-bar-4" style="--delay:165ms;--collapse-top:380px;--collapse-bottom:-380px;--overshoot-top:-11px;--overshoot-bottom:11px">
    <rect class="ident-stem" x="1050" y="200" width="320" height="760" fill="#F5B250" />
    <circle class="ident-cap ident-cap-top" cx="1210" cy="200" r="160" fill="#F5B250" />
    <circle class="ident-cap ident-cap-bottom" cx="1210" cy="960" r="160" fill="#F5B250" />
  </g>

  <g class="ident-bar ident-bar-5" style="--delay:220ms;--collapse-top:100px;--collapse-bottom:-100px;--overshoot-top:-7px;--overshoot-bottom:7px">
    <rect class="ident-stem" x="1400" y="440" width="320" height="200" fill="#4132A0" />
    <circle class="ident-cap ident-cap-top" cx="1560" cy="440" r="160" fill="#4132A0" />
    <circle class="ident-cap ident-cap-bottom" cx="1560" cy="640" r="160" fill="#4132A0" />
  </g>
</svg>

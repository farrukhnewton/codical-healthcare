<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Codical Health — Precision Signal Ident</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 36px 24px 52px;
      color: #17113d;
      background:
        radial-gradient(circle at 50% 12%, rgba(142, 104, 238, .14), transparent 34%),
        #eee9fb;
    }
    main { width: min(1160px, 100%); margin: 0 auto; }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 20px;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: #6b36d2;
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .17em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 44px); letter-spacing: -.05em; }
    .replay {
      min-height: 46px;
      padding: 0 20px;
      border: 1px solid rgba(36, 24, 90, .16);
      border-radius: 999px;
      color: #fff;
      background: #5f21d6;
      font: inherit;
      font-size: 13px;
      font-weight: 780;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(75, 26, 184, .22);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .replay:hover { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(75, 26, 184, .28); }
    .hero-stage {
      min-height: 550px;
      display: grid;
      place-items: center;
      padding: 78px;
      overflow: hidden;
      border: 1px solid rgba(70, 44, 132, .12);
      border-radius: 30px;
      background:
        radial-gradient(circle at 50% 47%, rgba(134, 92, 234, .11), transparent 42%),
        rgba(255, 255, 255, .88);
      box-shadow: 0 28px 90px rgba(52, 27, 109, .13);
      backdrop-filter: blur(20px);
    }
    .hero-stage img { display: block; width: min(620px, 100%); height: auto; }
    .context-grid {
      display: grid;
      grid-template-columns: 1.45fr .55fr .55fr;
      gap: 14px;
      margin-top: 14px;
    }
    .context {
      min-height: 170px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(70, 44, 132, .12);
      border-radius: 22px;
      background: rgba(255, 255, 255, .84);
      box-shadow: 0 16px 50px rgba(52, 27, 109, .08);
    }
    .context.dark { background: #090910; }
    .context > img { display: block; width: 110px; height: auto; }
    .lockup {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 28px 34px;
    }
    .lockup > img { width: 58px; height: auto; flex: 0 0 auto; }
    .wordmark { display: grid; grid-template-columns: auto auto; column-gap: 20px; align-items: baseline; }
    .wordmark strong { color: #12105e; font-size: 19px; font-weight: 900; line-height: .95; letter-spacing: -.04em; }
    .wordmark small {
      grid-column: 1 / -1;
      margin-top: 5px;
      color: #0f1eb4;
      font-size: 7px;
      font-weight: 850;
      letter-spacing: -.01em;
      white-space: nowrap;
    }
    .notes {
      display: flex;
      justify-content: space-between;
      gap: 28px;
      margin-top: 18px;
      color: #70698b;
      font-size: 13px;
      line-height: 1.55;
    }
    .notes p { margin: 0; }
    .notes strong { color: #241b51; }
    @media (max-width: 820px) {
      .hero-stage { min-height: 410px; padding: 50px; }
      .context-grid { grid-template-columns: 1fr 1fr; }
      .context:first-child { grid-column: 1 / -1; }
    }
    @media (max-width: 540px) {
      body { padding: 24px 14px 40px; }
      header { align-items: center; }
      .hero-stage { min-height: 330px; padding: 38px 24px; }
      .context-grid { grid-template-columns: 1fr; }
      .context:first-child { grid-column: auto; }
      .wordmark { column-gap: 12px; }
      .wordmark strong { font-size: 16px; }
      .notes { display: block; }
      .notes p + p { margin-top: 8px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Motion identity study 05</p>
        <h1>Precision signal</h1>
      </div>
      <button class="replay" type="button" id="replay">Replay animation</button>
    </header>

    <section class="hero-stage" aria-label="Large precision signal animation preview">
      <img class="ident-preview" src="codical-bars-premium-ident-v2-sample.svg" alt="Codical Health precision signal animation" />
    </section>

    <div class="context-grid">
      <section class="context lockup" aria-label="Codical Health navbar lockup preview">
        <img class="ident-preview" src="codical-bars-premium-ident-v2-sample.svg" alt="" />
        <div class="wordmark" aria-label="Codical Health, Precision in coding, power in revenue">
          <strong>CODICAL</strong><strong>HEALTH</strong>
          <small>PRECISION IN CODING, POWER IN REVENUE</small>
        </div>
      </section>
      <section class="context" aria-label="Small mark on light background">
        <img class="ident-preview" src="codical-bars-premium-ident-v2-sample.svg" alt="" />
      </section>
      <section class="context dark" aria-label="Small mark on dark background">
        <img class="ident-preview" src="codical-bars-premium-ident-v2-sample.svg" alt="" />
      </section>
    </div>

    <div class="notes">
      <p><strong>Refined choreography:</strong> shaped signal → calibrated node echo → mass-aware assembly → exact master mark.</p>
      <p><strong>Runtime:</strong> 0.92 seconds, one play, permanently still afterward.</p>
    </div>
  </main>

  <script>
    const replay = document.querySelector('#replay');
    const previews = Array.from(document.querySelectorAll('.ident-preview'));

    replay.addEventListener('click', () => {
      const token = Date.now();
      previews.forEach((preview) => {
        preview.src = `codical-bars-premium-ident-v2-sample.svg?replay=${token}`;
      });
    });
  </script>
</body>
</html>

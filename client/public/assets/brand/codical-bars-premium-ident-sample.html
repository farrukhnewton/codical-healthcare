<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Codical Health — Premium Motion Ident</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 24px;
      color: #17113d;
      background: #eee9fb;
    }
    main { width: min(1120px, 100%); margin: 0 auto; }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 20px;
    }
    .eyebrow {
      margin: 0 0 7px;
      color: #6d35db;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(25px, 4vw, 42px); letter-spacing: -.045em; }
    .replay {
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid rgba(36, 24, 90, .18);
      border-radius: 999px;
      color: #20164d;
      background: rgba(255, 255, 255, .72);
      font: inherit;
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 8px 28px rgba(39, 20, 87, .08);
    }
    .replay:hover { background: #fff; transform: translateY(-1px); }
    .contexts {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(260px, .8fr);
      gap: 16px;
    }
    .panel {
      overflow: hidden;
      border: 1px solid rgba(70, 44, 132, .14);
      border-radius: 28px;
      box-shadow: 0 26px 80px rgba(52, 27, 109, .13);
    }
    .hero-stage {
      min-height: 560px;
      display: grid;
      place-items: center;
      padding: 80px;
      background:
        radial-gradient(circle at 50% 45%, rgba(139, 102, 236, .13), transparent 45%),
        #fbfaff;
    }
    .hero-stage img { display: block; width: min(600px, 100%); height: auto; }
    .side { display: grid; grid-template-rows: 1fr 1fr; gap: 16px; }
    .mini-stage {
      min-height: 272px;
      display: grid;
      place-items: center;
      padding: 54px;
      background: #090910;
    }
    .mini-stage.light { background: #fff; }
    .mini-stage img { display: block; width: min(150px, 70%); height: auto; }
    .meta {
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      gap: 24px;
      color: #70698b;
      font-size: 13px;
      line-height: 1.55;
    }
    .meta strong { color: #241b51; }
    @media (max-width: 780px) {
      header { align-items: center; }
      .contexts { grid-template-columns: 1fr; }
      .hero-stage { min-height: 410px; padding: 55px; }
      .side { grid-template-columns: 1fr 1fr; grid-template-rows: auto; }
      .mini-stage { min-height: 210px; padding: 36px; }
    }
    @media (max-width: 520px) {
      body { padding: 24px 14px; }
      .side { grid-template-columns: 1fr; }
      .meta { display: block; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Motion identity study 04</p>
        <h1>Signal assembly</h1>
      </div>
      <button class="replay" type="button" id="replay">Replay ident</button>
    </header>

    <div class="contexts">
      <section class="panel hero-stage" aria-label="Large logo animation preview">
        <img class="ident-preview" src="codical-bars-premium-ident-sample.svg" alt="Codical Health animated logo" />
      </section>
      <div class="side">
        <section class="panel mini-stage" aria-label="Small logo preview on dark background">
          <img class="ident-preview" src="codical-bars-premium-ident-sample.svg" alt="" />
        </section>
        <section class="panel mini-stage light" aria-label="Small logo preview on light background">
          <img class="ident-preview" src="codical-bars-premium-ident-sample.svg" alt="" />
        </section>
      </div>
    </div>

    <div class="meta">
      <p><strong>Choreography:</strong> intelligence trace → five nodes → calibrated expansion → crisp master mark.</p>
      <p><strong>Runtime:</strong> 1.02 seconds, one play, no perpetual loop.</p>
    </div>
  </main>

  <script>
    const replay = document.querySelector('#replay');
    const previews = Array.from(document.querySelectorAll('.ident-preview'));

    replay.addEventListener('click', () => {
      const token = Date.now();
      previews.forEach((preview) => {
        preview.src = `codical-bars-premium-ident-sample.svg?replay=${token}`;
      });
    });
  </script>
</body>
</html>

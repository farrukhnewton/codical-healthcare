<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codical Health — fluid wave sample</title>
    <style>
      :root { color-scheme: light; font-family: Inter, Arial, sans-serif; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 40px;
        color: #11143b;
        background: linear-gradient(145deg, #f9fbff, #efe9ff 54%, #dfd3f7);
      }
      main { width: min(920px, 100%); display: grid; gap: 22px; }
      .preview {
        min-height: 500px;
        display: grid;
        place-items: center;
        overflow: hidden;
        border: 1px solid rgba(65, 50, 160, .12);
        border-radius: 30px;
        background: rgba(255, 255, 255, .78);
        box-shadow: 0 30px 90px rgba(65, 50, 160, .15);
        backdrop-filter: blur(24px);
      }
      .preview img { width: min(580px, 80%); height: auto; }
      .navbar-sample {
        min-height: 78px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 22px;
        border: 1px solid rgba(255,255,255,.94);
        border-radius: 26px;
        background: rgba(245, 242, 255, .88);
        box-shadow: 0 18px 48px rgba(65, 50, 160, .12);
      }
      .navbar-sample img { width: 58px; height: 50px; object-fit: contain; }
      .wordmark { display: grid; line-height: .88; color: #0f1eb4; font-weight: 900; }
      .wordmark span { font-size: 17px; }
      .wordmark small { font-size: 14px; }
      p { margin: 0; color: rgba(17, 20, 59, .66); font-size: 14px; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <section class="preview" aria-label="Large fluid wave logo preview">
        <img src="./codical-bars-fluid-wave-sample.svg" alt="Animated Codical Health fluid wave bars" />
      </section>
      <section class="navbar-sample" aria-label="Navbar-size fluid wave logo preview">
        <img src="./codical-bars-fluid-wave-sample.svg" alt="" />
        <div class="wordmark"><span>CODICAL</span><small>HEALTH</small></div>
      </section>
      <p>Continuous 2.6-second fluid equalizer · circular caps remain exact · no clipping · reduced-motion safe</p>
    </main>
  </body>
</html>

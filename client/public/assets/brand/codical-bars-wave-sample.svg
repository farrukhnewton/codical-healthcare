<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="3840"
  height="2500"
  viewBox="0 0 1720 1120"
  fill="none"
  role="img"
  aria-labelledby="codical-wave-title codical-wave-description"
  shape-rendering="geometricPrecision"
>
  <title id="codical-wave-title">Animated Codical Health brand bars</title>
  <desc id="codical-wave-description">Five rounded brand bars moving in a subtle sequential intelligence wave.</desc>
  <style>
    .codical-wave-bar {
      transform-box: fill-box;
      transform-origin: center;
      animation: codical-intelligence-wave 2.8s cubic-bezier(.42, 0, .2, 1) infinite;
      will-change: transform;
    }

    .codical-wave-bar:nth-of-type(1) { animation-delay: 0ms; }
    .codical-wave-bar:nth-of-type(2) { animation-delay: 120ms; }
    .codical-wave-bar:nth-of-type(3) { animation-delay: 240ms; }
    .codical-wave-bar:nth-of-type(4) { animation-delay: 360ms; }
    .codical-wave-bar:nth-of-type(5) { animation-delay: 480ms; }

    @keyframes codical-intelligence-wave {
      0%, 12%, 68%, 100% { transform: scaleY(1); }
      27% { transform: scaleY(1.075); }
      42% { transform: scaleY(.985); }
      54% { transform: scaleY(1.018); }
    }

    @media (prefers-reduced-motion: reduce) {
      .codical-wave-bar { animation: none; }
    }
  </style>
  <rect class="codical-wave-bar" x="0" y="320" width="320" height="520" rx="160" fill="#EE7D4B" />
  <rect class="codical-wave-bar" x="350" y="0" width="320" height="1120" rx="160" fill="#0F1EB4" />
  <rect class="codical-wave-bar" x="700" y="280" width="320" height="560" rx="160" fill="#EB966E" />
  <rect class="codical-wave-bar" x="1050" y="40" width="320" height="1080" rx="160" fill="#F5B250" />
  <rect class="codical-wave-bar" x="1400" y="280" width="320" height="520" rx="160" fill="#4132A0" />
</svg>

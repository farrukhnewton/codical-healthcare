<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="3840"
  height="2992"
  viewBox="0 -110 1720 1340"
  fill="none"
  role="img"
  aria-labelledby="codical-fluid-title codical-fluid-description"
  shape-rendering="geometricPrecision"
>
  <title id="codical-fluid-title">Codical Health fluid equalizer animation</title>
  <desc id="codical-fluid-description">Five rounded brand bars flowing continuously while their circular endcaps remain precise.</desc>
  <style>
    .fluid-bar {
      animation-duration: 2.6s;
      animation-timing-function: cubic-bezier(.45, 0, .2, 1);
      animation-iteration-count: infinite;
      animation-fill-mode: both;
      will-change: y, height;
    }

    .fluid-bar-1 { animation-name: fluid-wave-1; animation-delay: 0ms; }
    .fluid-bar-2 { animation-name: fluid-wave-2; animation-delay: 135ms; }
    .fluid-bar-3 { animation-name: fluid-wave-3; animation-delay: 270ms; }
    .fluid-bar-4 { animation-name: fluid-wave-4; animation-delay: 405ms; }
    .fluid-bar-5 { animation-name: fluid-wave-5; animation-delay: 540ms; }

    @keyframes fluid-wave-1 {
      0%, 100% { y: 320px; height: 520px; }
      25% { y: 282px; height: 596px; }
      50% { y: 320px; height: 520px; }
      75% { y: 338px; height: 484px; }
    }
    @keyframes fluid-wave-2 {
      0%, 100% { y: 0px; height: 1120px; }
      25% { y: -70px; height: 1260px; }
      50% { y: 0px; height: 1120px; }
      75% { y: 35px; height: 1050px; }
    }
    @keyframes fluid-wave-3 {
      0%, 100% { y: 280px; height: 560px; }
      25% { y: 236px; height: 648px; }
      50% { y: 280px; height: 560px; }
      75% { y: 298px; height: 524px; }
    }
    @keyframes fluid-wave-4 {
      0%, 100% { y: 40px; height: 1080px; }
      25% { y: -28px; height: 1216px; }
      50% { y: 40px; height: 1080px; }
      75% { y: 74px; height: 1012px; }
    }
    @keyframes fluid-wave-5 {
      0%, 100% { y: 280px; height: 520px; }
      25% { y: 242px; height: 596px; }
      50% { y: 280px; height: 520px; }
      75% { y: 298px; height: 484px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fluid-bar { animation: none; }
    }
  </style>
  <rect class="fluid-bar fluid-bar-1" x="0" y="320" width="320" height="520" rx="160" fill="#EE7D4B" />
  <rect class="fluid-bar fluid-bar-2" x="350" y="0" width="320" height="1120" rx="160" fill="#0F1EB4" />
  <rect class="fluid-bar fluid-bar-3" x="700" y="280" width="320" height="560" rx="160" fill="#EB966E" />
  <rect class="fluid-bar fluid-bar-4" x="1050" y="40" width="320" height="1080" rx="160" fill="#F5B250" />
  <rect class="fluid-bar fluid-bar-5" x="1400" y="280" width="320" height="520" rx="160" fill="#4132A0" />
</svg>
